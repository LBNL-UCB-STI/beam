task printRuntimeClasspath(type: JavaExec) {
    mainClass = 'java.lang.Object' // Dummy main class, won't run
    doFirst {
        println "Runtime classpath:"
        sourceSets.main.runtimeClasspath.each { file ->
            println file.name
        }
    }
    classpath = sourceSets.main.runtimeClasspath
    // Prevent actual execution
    enabled = false
}

