}


tasks.register('buildImage', DockerBuildImage) {
    dependsOn createDockerfile
    inputDir = file('build/docker')
    platform = 'linux/amd64'

    String repo = getDockerRepository()
    String tagName = getDockerTag()

    if (repo.isEmpty() || tagName.isEmpty()) {
        throw new GradleException("Please specify a tag using -Ptag=repository:version")
    }

    String fullTag = "${repo}:${tagName}"
    images.add(fullTag)

    doFirst {
        println "Building Docker image: ${fullTag}"
    }
}

