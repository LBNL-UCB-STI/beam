    driving_vmt_daily: 2887500000000  # 87.5% of 3.3 trillion VMT
    fleet_size: 261362500 # 87.5% of 298.7 million units

  - level: 1
    driving_vmt_daily: 240900000000   # 7.3% of 3.3 trillion VMT
    fleet_size: 21805100 # 7.3% of 298.7 million units
