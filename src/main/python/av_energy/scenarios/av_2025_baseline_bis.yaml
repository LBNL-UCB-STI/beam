    urban_principal_arterial: 0.75
    urban_minor_arterial: 0.8
    urban_major_collector: 0.85
    urban_minor_collector: 0.9
    urban_local: 0.95

  cooling_config:
    cooling_overhead_factor: 0.77  # 77% (For a typical automobile air conditioner, it consumes around 77% of the cooling load to dissipate the heat generated by the system)

  training_config:
    gpu_utilization_rate: 0.75           # 75% average GPU utilization
    failed_runs_overhead_factor: 1.2     # 20% overhead for failed training runs
    model_iterations_per_year: 52        # every week model updates
    continuous_training_factor: 0.2        # 20% of time spent on continuous learning
    full_retraining_hours_per_iteration: 720    # 30 days for full retraining
    incremental_training_hours_per_iteration: 336  # 2 weeks for incremental training
    cooling_power_ratio: 0.77             # Cooling power as ratio of compute power
    networking_power_ratio: 0.1          # Networking power for distributed training
    storage_power_ratio: 0.05            # Storage power for checkpoints and datasets

fleet:
