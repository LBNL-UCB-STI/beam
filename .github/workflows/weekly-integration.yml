name: BEAM Weekly Integration Tests

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-specs:
    name: Run Integration Specs
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: false

      - name: Restore Git LFS Cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblosc-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Integration Specs
        run: |
          ./gradlew spec -Ppackages="beam.integration" --info --stacktrace

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalatest-report-integration
          path: |
            build/scalatest-report/
            build/scalatest-report-xml/
          retention-days: 14
