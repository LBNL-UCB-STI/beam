name: BEAM Weekly Integration Tests

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  integration-specs:
    name: Run Integration Specs
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: false

      - name: Restore Git LFS Cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblosc-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Integration Specs
        run: |
          ./gradlew spec -Ppackages="beam.integration" --info --stacktrace

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalatest-report-integration
          path: |
            build/scalatest-report/
            build/scalatest-report-xml/
          retention-days: 14

      - name: Open or Update Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[CI] BEAM Weekly Integration Tests Failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 10);
            const body = [
              `The **BEAM Weekly Integration Tests** workflow failed on branch \`${context.refName}\` at commit \`${sha}\`.`,
              ``,
              `- **Workflow Run**: [${context.runId}](${runUrl})`,
              `- **Commit**: \`${context.sha}\``,
              `- **Artifacts**: Check the \`scalatest-report-integration\` artifact on the workflow run page for detailed failure output.`
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 50
            });
            const existing = issues.data.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
