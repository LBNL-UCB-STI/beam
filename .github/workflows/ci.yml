name: BEAM CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast Gate: Compiles all Java & Scala code, checks formatting and linter
  compile-and-lint:
    name: Compile & Linter Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false  # Do not pull private data submodules

      - name: Restore Git LFS Cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblosc-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master' }}

      - name: Compile Main & Test Classes
        run: |
          ./gradlew --stacktrace testClasses -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Prebuild R5 Network Fixture
        run: |
          ./gradlew specificTest -Psuite="scripts.TravelTimeAndDistanceCalculatorAppSpec" -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Upload R5 Network Fixture
        uses: actions/upload-artifact@v4
        with:
          name: r5-beamville-network
          path: test/input/beamville/r5/network.dat
          retention-days: 1

  # Parallel Spec Test Execution across 4 concurrent runner jobs
  spec-matrix:
    name: Test Suite (${{ matrix.suite-name }})
    needs: compile-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite-name: agentsim
            packages: "beam.agentsim"
            suites: ""
          - suite-name: physsim-router
            packages: "beam.physsim,beam.router"
            suites: ""
          - suite-name: analysis-sim
            packages: "beam.analysis,beam.sim"
            suites: ""
          - suite-name: scripts-replanning-cosim
            packages: "scripts,beam.replanning,beam.cosim"
            suites: "beam.integration.EventsFileSpec"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false

      - name: Restore Git LFS Cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblosc-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Download R5 Network Fixture
        uses: actions/download-artifact@v4
        with:
          name: r5-beamville-network
          path: test/input/beamville/r5

      - name: Run Sharded ScalaTest Suite
        run: |
          ./gradlew spec -Ppackages="${{ matrix.packages }}" -Psuites="${{ matrix.suites }}" -PnumThreads=4 -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalatest-report-${{ matrix.suite-name }}
          path: |
            build/scalatest-report/
            build/scalatest-report-xml/
          retention-days: 7
