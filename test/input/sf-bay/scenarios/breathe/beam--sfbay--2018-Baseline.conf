include "../../sfbay-base.conf"

beam.agentsim.simulationName = "beam--sfbay--2018-Baseline--breathe"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.1
beam.agentsim.lastIteration = 0

beam.physsim.flowCapacityFactor = 0.07
#beam.physsim.storageCapacityFactor = 0.5
beam.physsim.storageCapacityFactor = 1.0
beam.physsim.name = "JDEQSim"
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/physsim-network.xml"
#beam.physsim.overwriteLinkParamPath = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/updatedLinkParams.csv"

beam.warmStart.type = "linkStatsOnly"
beam.warmStart.initialLinkstatsFilePath = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/2018-baseline-linkstats/3.linkstats.FC07.v3.csv.gz"

beam.physsim.jdeqsim.shortLink.storageCapacityOverride {
    minimumLinkLengthThreshold = 0.0  # Minimum length threshold (greater than 0) to activate lane override.
    overriddenNumLanesPerLink = 10.0  # Number of lanes to use when overriding the default configuration for short links.
}

beam.routing.r5.travelTimeNoiseFraction = 0.1
beam.routing.r5.directory = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network"
beam.routing.r5.osmMapdbFile = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/osm.mapdb"
# beam.routing.r5.directory2 = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network-no-buses"
beam.routing.writeRoutingStatistic = false



beam.agentsim.agents.vehicles.emissions {
  events = false
  skims = true
  countyLookup = {
    filePath = ${beam.inputDirectory}"/shape/sfbay_county_2018_wgs84.geojson"
    countyFieldName = "NAME"
  }
  workdayIdleTimeFraction = {
    bus = 0.3554
    class456 = 0.3327
    class78v = 0.3129
    class78t = 0.1281
  }
}


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/20250730/2018-Baseline/payloads--2018-Baseline.parquet"
  toursFilePath = ${beam.inputDirectory}"/freight/20250730/2018-Baseline/tours--2018-Baseline.parquet"
  carriersFilePath = ${beam.inputDirectory}"/freight/20250730/2018-Baseline/carriers--2018-Baseline--EM.parquet"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/vehicleTypes--frism--2018-Baseline--EM.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}

beam.agentsim.agents.vehicles.vehiclesFilePath = ${beam.inputDirectory}"/urbansim/atlas-2019/vehicles--2019-Baseline--EM.parquet"
beam.agentsim.agents.vehicles.vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/vehicleTypes--atlas--2019-Baseline--EM.csv"
beam.agentsim.agents.vehicles.dummySharedCar.vehicleTypeId = "pre2004LDAGas--2015Chrysler200--CarConv1986"
beam.exchange.scenario {# source for now can be "Beam" or "UrbanSim"
    source = "urbansim_v2"
    # Input file format for scenario loader can be "xml", "csv" or "parquet"
    fileFormat = "parquet"
    folder = ${beam.inputDirectory}"/urbansim/atlas-2019"
    # Allows to match urbansim modes to beam modes

    modeMap = [
      "BIKE           -> bike",
      "DRIVEALONEFREE -> car",
      "DRIVEALONEPAY  -> car",
      "DRIVE_COM      -> drive_transit",
      "DRIVE_EXP      -> drive_transit",
      "DRIVE_HVY      -> drive_transit",
      "DRIVE_LOC      -> drive_transit",
      "DRIVE_LRF      -> drive_transit",
      "SHARED2FREE    -> hov2",
      "SHARED2PAY     -> hov2",
      "SHARED3FREE    -> hov3",
      "SHARED3PAY     -> hov3",
      "TAXI           -> ride_hail",
      "TNC_SHARED     -> ride_hail_pooled",
      "TNC_SINGLE     -> ride_hail",
      "WALK           -> walk",
      "WALK_COM       -> walk_transit",
      "WALK_EXP       -> walk_transit",
      "WALK_HVY       -> walk_transit",
      "WALK_LOC       -> walk_transit",
      "WALK_LRF       -> walk_transit",
    ]
    convertWgs2Utm = true
    urbansim.activitySimEnabled = false
    urbansim.scenarioLoadingTimeoutSeconds = 3000
}


beam.agentsim.agents.rideHail.managers = [{
  name = "Uber",
  supportedModes="ride_hail, ride_hail_pooled"
  initialization.initType = "PROCEDURAL" # Other possible values - FILE
