include "scenarios/breathe/beam--sfbay--2018-Baseline.conf"

beam.inputDirectory = "test/input/sf-bay"

beam.agentsim.simulationName = "test-sfbay-1pct-emissions"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.1
beam.agentsim.firstIteration = 0
beam.agentsim.lastIteration = 0

beam.warmStart.type = "disabled"

beam.outputs.baseOutputDirectory = "output/test-sf-bay"
beam.outputs.addTimestampToOutputDirectory = true
beam.outputs.writeAnalysis = false
beam.outputs.events.fileOutputFormats = "csv.gz"
beam.outputs.events.eventsToWrite = "ActivityEndEvent,ActivityStartEvent,AgencyRevenueEvent,ChargingPlugInEvent,ChargingPlugOutEvent,FleetStoredElectricityEvent,LeavingParkingEvent,ModeChoiceEvent,ParkingEvent,PathTraversalEvent,PersonArrivalEvent,PersonCostEvent,PersonDepartureEvent,PersonEntersVehicleEvent,PersonLeavesVehicleEvent,RefuelSessionEvent,ReplanningEvent,ReserveRideHailEvent,RideHailReservationConfirmationEvent,ShiftEvent,TeleportationEvent,VehicleEntersTrafficEvent,VehicleLeavesTrafficEvent"

beam.router.skim {
  keepKLatestSkims = 1
  writeSkimsInterval = 1
  writeAggregatedSkimsInterval = 1

  emissions-skimmer {
    fileOutputFormat = "csv.gz"
  }
}

beam.agentsim.agents.vehicles.emissions {
  events = false
  skims = true
  countyLookup = {
    filePath = ${beam.inputDirectory}"/shape/sfbay_county_2018_wgs84.geojson"
    countyFieldName = "NAME"
  }
  pollutantsFilter = "CH4,CO,CO2,HC,NH3,N2O,NOx,PM,PM10,PM25,ROG,SOx,TOG,BC"
  ratesFilter = {
    speed = "RUNEX,PTOEX,PMBW"
    soakTime = "STREX"
    county = "RUNEX,IDLEX,STREX,HOTSOAK,DIURN,RUNLOSS,PMTW,PMBW,PRDUST,PTOEX"
    roadCategory = "PRDUST"
  }
}

beam.exchange.scenario {
  fileFormat = "parquet"
  folder = ${beam.inputDirectory}"/urbansim/atlas-2019"
}

beam.agentsim.agents.vehicles.vehiclesFilePath = ${beam.inputDirectory}"/urbansim/atlas-2019/vehicles--2019-Baseline--EM.parquet"

beam.agentsim.agents.freight {
  plansFilePath = ${beam.inputDirectory}"/freight/20250730/2018-Baseline/payloads--2018-Baseline.parquet"
  toursFilePath = ${beam.inputDirectory}"/freight/20250730/2018-Baseline/tours--2018-Baseline.parquet"
  carriersFilePath = ${beam.inputDirectory}"/freight/20250730/2018-Baseline/carriers--2018-Baseline--EM.parquet"
  tourSampleSizeAsFractionOfTotal = 0.1
}
