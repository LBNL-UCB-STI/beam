beam.agentsim.agents.parking.search.params {
    enableLinkBasedSearch = true # if this is false then make sure distances are large enough as it searches for centroids, otherwise, it searches for nearby links
    passenger.minSearchRadius = 250.00  # something small enough that, on average, we see 2 orders of magnitude of samples at most
    passenger.maxSearchRadius = 8046.72 # something large enough that we do not strand our drivers in an oasis
    freight.minSearchRadius = 10.0  # something small enough that, on average, to ensure freight vehicle park close to load/unload locations
    freight.maxSearchRadius = 500.0 # something large enough that we we allow freight driver to walk few blocks if needed
    searchDoubleParkingRadius = 0.0 # if greater than zero then double parking stall is provided if a regular stall is not found within this radius
    searchMaxDistanceRelativeToEllipseFoci = 4.0 # something large enough that we do not travel longer than the actual distance to destination
    searchSampleSize = 5000
}

