include "beam.conf"

beam.agentsim.simulationName = "freight"

beam.agentsim.firstIteration = 0
beam.agentsim.lastIteration = 0

beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/payload-plans.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/freight-tours.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/freight-carriers.csv"
  carrierParkingFilePath = ${beam.inputDirectory}"/freight/freight-depots.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/freight/freight-vehicleTypes.csv"
  reader = "Generic"
  replanning {
    disableAfterIteration = 1
    departureTime = 28800
    strategy = "singleTour"
  }
}

beam.physsim.flowCapacityFactor = 0.001
beam.physsim.skipPhysSim = true

beam.agentsim.agents.vehicles.emissions {
  # This is the list of pollutants to filter out among
  # "CH4", "CO", "CO2", "HC", "NH3", "NOx", "PM", "PM10", "PM2_5", "ROG", "SOx", "TOG", "BC", "BCm"
  pollutantsFilter = ["CH4", "CO", "CO2", "HC", "NH3", "NOx", "PM", "PM10", "PM2_5", "ROG", "SOx", "TOG", "BC", "BCm", "BCh"]
  # This will embed emissions profiles in the following events: PathTraversalEvent, LeavingParkingEvent
  events = true
  # This will produce link-level skims through emissions-skimmer
  skims = true
  ratesFilter = {
      speed = ["RUNEX", "PMBW"]
      grade = [string] | []
      weight = [string] | [] # Currently assuming an average number of trucks
      soakTime = ["STREX"]
      county = ["RUNEX", "IDLEX", "STREX", "HOTSOAK", "DIURN", "RUNLOSS", "PMTW", "PMBW", "PRDUST"]
      roadCategory = ["PRDUST"]
  }
  workdayIdleTimeFraction = {
    bus = 0.3554
    class456 = 0.3327
    class78v = 0.3129
    class78t = 0.1281
  }
}