include "beam.conf"

beam.agentsim.simulationName = "emissions"

beam.agentsim.firstIteration = 0
beam.agentsim.lastIteration = 0

beam.agentsim.agents.vehicles.vehicleTypesFilePath = ${beam.inputDirectory}"/vehicleTypes-emissions.csv"

beam.agentsim.agents.vehicles.emissions {
  # This is the list of pollutants to filter out among
  # "CH4", "CO", "CO2", "HC", "NH3", "N2O", "NOx", "PM", "PM10", "PM25", "ROG", "SOx", "TOG", "BC"
  pollutantsFilter = "CH4,CO,CO2,HC,NH3,N2O,NOx,PM,PM10,PM25,ROG,SOx,TOG,BC"
  # This will embed emissions profiles in the following events: PathTraversalEvent, LeavingParkingEvent
  events = true
  # This will produce link-level skims through emissions-skimmer
  skims = true
  ratesFilter = {
      speed = "RUNEX,PTOEX,PMBW"
      soakTime = "STREX"
      county = "RUNEX,IDLEX,STREX,HOTSOAK,DIURN,RUNLOSS,PMTW,PMBW,PRDUST,PTOEX"
      roadCategory = "PRDUST"
  }
  workdayIdleTimeFraction = {
    bus = 0.3554
    class456 = 0.3327
    class78v = 0.3129
    class78t = 0.1281
  }
  countyLookup = {
    filePath = ${beam.inputDirectory}"/sfbay_county_simplified_wgs84.geojson"
    countyFieldName = "NAME"
  }
}
